<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floreria Los amantes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header id="inicio">
      <h1>FLORES LOS AMANTES</h1>
      <nav>
        <a href="#inicio">Inicio</a>
        <a href="#arreglos">Productos</a>
        <a href="#contacto">Contacto</a>
      </nav>
    </header>

    <main>
      <section id="arreglos">
        <h2>Productos</h2>
        <p>Presentación del negocio.</p>
        <ul>
          <li>Producto 1 - Bs 10</li>
          <li>Producto 2 - Bs 20</li>
          <li>Producto 3 - Bs 30</li>
        </ul>
      </section>

      <section id="contacto">
        <h2>Contacto</h2>
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" required />

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" required />

        <label for="detalle">Detalle del pedido:</label>
        <textarea id="detalle"></textarea>
      </section>
    </main>

    <footer>Maycol Tarifa Miranda</footer>

    <script src="script.js"></script>
  </body>
</html>
